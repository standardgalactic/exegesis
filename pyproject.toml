[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exegesis"
version = "0.1.0"
description = "Local-first PDF corpus discovery, extraction and Ollama exegesis"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]

[project.scripts]
exegesis = "exegesis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
